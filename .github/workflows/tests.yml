name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  meson-tests:
    name: Flatpak build and Meson tests
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Configure Flathub
        run: >-
          flatpak remote-add --user --if-not-exists
          flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Build development manifest and run Meson tests
        run: >-
          flatpak-builder --user --install-deps-from=flathub
          --force-clean --keep-build-dirs
          build-dir build-aux/com.usebottles.bottles.Devel.json
      - name: Save build and test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: meson-test-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .flatpak-builder/build/bottles*/_flatpak_build/meson-logs/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
