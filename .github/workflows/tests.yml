name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  meson-tests:
    name: Flatpak build and Meson tests
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build and test
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: build-aux/com.usebottles.bottles.Devel.json
          build-bundle: false
          build-dir: build-dir
          run-tests: true
          keep-build-dirs: true

      - name: Save build and test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: meson-test-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .flatpak-builder/build/bottles*/_flatpak_build/meson-logs/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
